[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amfwx"
version = "5.47.0"
description = "AMFWX - an independent self-contained GUI framework experiment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andreas Meyer" }]
dependencies = []

[project.optional-dependencies]
scanner = ["pillow>=10.0", "comtypes>=1.2", "pyserial>=3.5"]
camera = ["pillow>=10.0", "opencv-python-headless>=4.8", "numpy>=1.24"]
ocr = ["pillow>=10.0", "pymupdf>=1.24", "winsdk>=1.0"]
pdf = ["pillow>=10.0", "pymupdf>=1.24"]
iot = ["cryptography>=41.0"]
full = ["pillow>=10.0", "comtypes>=1.2", "pyserial>=3.5",
        "opencv-python-headless>=4.8", "numpy>=1.24",
        "pymupdf>=1.24", "winsdk>=1.0", "cryptography>=41.0"]

[project.scripts]
amfwx-sdk = "amfwx.sdk:main"
amfwx-mcp = "amfwx.mcp:main"

[tool.setuptools.packages.find]
include = ["amfwx*"]

[tool.setuptools.package-data]
amfwx = ["bin/*.dll", "bin/*.txt", "bin/*.ico", "py.typed", "vendor/python32/*", "vendor/python32/**/*"]
