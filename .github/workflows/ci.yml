name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Tests
        shell: pwsh
        run: python -m unittest discover -s tests

  test-build:
    needs: test-matrix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .

      - name: 32-bit runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "python32.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-win32.zip" -OutFile $zip
          New-Item -ItemType Directory -Force -Path vendor/python32 | Out-Null
          Expand-Archive -Path $zip -DestinationPath vendor/python32 -Force
          if (-not (Test-Path vendor/python32/python.exe)) { throw "32-bit python fehlt" }

      - name: Tests
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Hardening
        shell: pwsh
        run: |
          python tools/verify_native.py
          python tools/hardening_check.py --no-tests
          python tools/sbom.py --output dist/sbom.json
          python tools/a11y_audit.py --output dist/a11y.json
          python tools/hardware_check.py --output dist/hardware.json

      - name: Build artifacts
        shell: pwsh
        run: |
          python tools/build_portable.py
          powershell -ExecutionPolicy Bypass -File tools/build_app.ps1
          python tools/build_own_installer.py

      - name: Silent install test
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE "install-test"
          $installer = Get-ChildItem dist/AMFWX-Own-Setup-*.exe | Select-Object -First 1
          $process = Start-Process $installer.FullName -ArgumentList "/S", "/D=$target" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exit $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $target "AMFWX.exe"))) { throw "AMFWX.exe fehlt" }
          $uninstall = Start-Process cmd -ArgumentList '/c', "`"$target\uninstall.cmd`"" -PassThru -Wait
          Start-Sleep -Milliseconds 500
          if (Test-Path $target) { throw "Uninstaller hat Ziel nicht entfernt" }
          Write-Host "Uninstall exit $($uninstall.ExitCode), target removed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amfwx-ci
          path: |
            dist/amfwx-*.whl
            dist/AMFWX-Portable-*.zip
            dist/AMFWX-Own-Setup-*.exe
            dist/sbom.json
          if-no-files-found: error
