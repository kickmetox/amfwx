name: SignPath Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .
      - name: Build app
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_app.ps1
      - name: Build installer
        shell: pwsh
        run: python tools/build_own_installer.py
      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/AMFWX-Own-Setup-*.exe
          if-no-files-found: error

  sign:
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v1.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: amfwx
          signing-policy-slug: release-signing
          artifact-configuration-slug: amfwx-installer
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: signed-installer
          path: signed/AMFWX-Own-Setup-*.exe
          if-no-files-found: error
